# experiments/designs/pricing_profit_v1.toml — ROADMAP Phase 7, Route 2 Stage B.
#
# Domestic profit income (ADR-0030): the markup rent is distributed to the
# household at (1 - s_pi) Pi, untaxed (tau stays on wage income, v1), and
# s_pi Pi is the retained leak. s_pi = 1 is Stage A exactly; the Stage A cells
# live in pricing_markup_v1 of the same generation.
#
# Named pricing_profit_v1 rather than the ROADMAP's working name
# "pricing_markup_v2": a -v2 suffix denotes a re-minted generation of the same
# design in this repository (ADR-0004), which Stage B is not.
#
schema_version = 1
design = "pricing_profit_v1"
description = "Phase 7 Route 2 Stage B (ADR-0030, closure P2): distributed markup rent, E = (1 - tau) w L + F + (1 - s_pi) Pi, fixed-wage gauge (GAMMA) on all three financing columns, kappa in {0.25, 0.5} x s_pi in {0.5, s = 0.1199}. s_pi = 1 is Stage A (pricing_markup_v1)."
smoke = false
[data]
vintage = "full-71-abill"
drops = []
calibration_root = "src"
source_table = "data/I-O_DE2019_formatiert.csv"
calibration_artifacts = []

[calibration]
saving_rate = 0.1199
intermediate_imports = 0.2214
intermediate_taxes = 0.0257449423974625
baseline_root_tol = 1e-12

[programme]
source = "cbase2/data_raw/impulses.csv"
year = 2024
column_slice = [3, 73]
total_eur_m = 40300.0
f1_shift = "tilt_g0_over_c0"

[reference]
labor = "ALPHA"
eta = 1.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
exo_scale_steps = 6
thetas = [2.0, 1.5, 1.2, 1.0, 0.8, 0.65, 0.5]

[gates]
residual_tol = 1e-6
budget_tol = 1e-9
labour_tol = 1e-6
wage_tol = 1e-8

[pricing]
kind = "markup"
kappa = 0.0
s_pi = 1.0
multistart_tol = 1e-6
continuation_steps = 4

[cells.pricing_profit-v1-GAMMA-F1-k025-spi05]
labor = "GAMMA"
financing = "F1"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
kappa = 0.25
s_pi = 0.5
note = "P2 distributed markup (Stage B), kappa = 0.25, s_pi = 0.5; fixed real wage, compositional F1 shift"

