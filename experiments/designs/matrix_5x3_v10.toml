# experiments/designs/matrix_5x3_v10.toml — the 5x3 evaluation matrix plus the
# sectoral-labour cells (ADR-0022), re-minted after the C1 measurement fix.
#
# Why a new generation: the review of the v6-v9 line found C1 — `gdp_components`
# collapsed the SECTORAL wage vector to its first entry on the eighteen
# `matrix_5x3-v9-BETA-*` cells (eta = 1 with `eta_s_vec`), so their `gdp`,
# `gdp_rel`, `gdp_expenditure(_rel)`, `gdp_deflator`, `gdp_wedge` and the
# `gdp_c` / `gdp_m_final` diagnostics are wrong; the solve is unaffected. The
# fix (commit 8774595, the wage selection now mirrors `sect`) changes `src/`,
# so the v9 provenance is superseded (ADR-0004) and the matrix is re-minted as
# v10 with the unchanged thirty-three cells.
#
# Expected outcome (checked after the batch): the fifteen matrix cells
# reproduce v9 bit-for-bit in every field (their wage is scalar, so the fix is
# measurement-only for them), and the eighteen sectoral cells reproduce the v9
# SOLUTIONS while reporting corrected gdp metrics; the harness now hard-asserts
# the ADR-0019 companion identity `gdp_wedge = -canary_diff` (<= 1e-9) in every
# cell, which the v9 sectoral manifests violate at ~1e-3.
#
# History: v7 and v8 are the record of the two promotion-plumbing aborts; v9 is
# the record of the first complete sectoral generation (pre-fix; superseded for
# the sectoral gdp columns); v10 is the citable generation.
#
schema_version = 1
design = "matrix_5x3_v10"
description = "Labour x financing evaluation matrix with the ADR-0022 sectoral-labour cells, re-minted on the corrected gdp measurement (C1). The fifteen matrix cells reproduce matrix_5x3_v9 bit-for-bit; the eighteen sectoral cells carry the corrected gdp_* metrics. Supersedes matrix_5x3_v7/v8 (aborted) and matrix_5x3_v9 (C1 measurement defect) for citation."
smoke = false
[data]
vintage = "full-71-abill"
drops = []
calibration_root = "src"
source_table = "data/I-O_DE2019_formatiert.csv"
calibration_artifacts = []

[calibration]
saving_rate = 0.1199
intermediate_imports = 0.2214
intermediate_taxes = 0.0257449423974625
baseline_root_tol = 1e-12

[programme]
source = "cbase2/data_raw/impulses.csv"
year = 2024
column_slice = [3, 73]
total_eur_m = 40300.0
f1_shift = "tilt_g0_over_c0"

[reference]
labor = "ALPHA"
eta = 1.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
exo_scale_steps = 6
thetas = [2.0, 1.5, 1.2, 1.0, 0.8, 0.65, 0.5]

[gates]
residual_tol = 1e-6
budget_tol = 1e-9
labour_tol = 1e-6
wage_tol = 1e-8

