# experiments/designs/matrix_5x3.toml — the 5×3 evaluation matrix (Phase 3)
#
# The 15 cells matrix_5x3-<L>-<F> for L in BF/ALPHA/BETA/GAMMA/DELTA and
# F in F1/F2/F3. Pinned by preregistration: run
#   julia --project=. experiments/run.jl --preregister matrix_5x3
# before executing; experiments/run.jl --design matrix_5x3 refuses to start
# when this file's SHA-256 does not match registry/preregistration.toml.
# See experiments/README.md and ADR-0006.
#
# η ∈ {0, 1} only (ADR-0010): BF is the immobile endpoint (η = 0), ALPHA,
# BETA, GAMMA, DELTA and the reference continuation use fully mobile
# allocation (η = 1). The former interpolated η = 0.5 and its allocation wedge
# are retired.

schema_version = 1
design = "matrix_5x3"
description = "Labour (BF/ALPHA/BETA/GAMMA/DELTA) x financing (F1/F2/F3) evaluation matrix on the 70-sector v3 open-economy calibration"
smoke = false

[data]
vintage = "cbase2-v3"
drops = [71]
calibration_root = "cbase2"
calibration_artifacts = ["cbase2/data_processed/AC_domestic_final_demand.csv"]

[programme]
source = "cbase2/data_raw/impulses.csv"
year = 2024
column_slice = [3, 73]   # 1-based inclusive (sectors 1..71)
total_eur_m = 40300.0
f1_shift = "one_plus_psi"

[reference]
labor = "ALPHA"
eta = 1.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
exo_scale_steps = 6
thetas = [2.0, 1.5, 1.2, 1.0, 0.8, 0.65, 0.5]

[gates]
residual_tol = 1e-6
budget_tol = 1e-9
labour_tol = 1e-6
wage_tol = 1e-8

[cells.matrix_5x3-BF-F1]
labor = "BF"
financing = "F1"
eta = 0.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "BF immobile baseline allocation (eta=0) with compositional F1 shift"

[cells.matrix_5x3-BF-F2]
labor = "BF"
financing = "F2"
eta = 0.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "BF immobile baseline allocation (eta=0), tax-financed programme"

[cells.matrix_5x3-BF-F3]
labor = "BF"
financing = "F3"
eta = 0.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "BF immobile baseline allocation (eta=0), externally financed programme"

[cells.matrix_5x3-ALPHA-F1]
labor = "ALPHA"
financing = "F1"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Full-employment mobile labour (eta=1) with compositional F1 shift"

[cells.matrix_5x3-ALPHA-F2]
labor = "ALPHA"
financing = "F2"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Full-employment mobile labour (eta=1), tax-financed programme"

[cells.matrix_5x3-ALPHA-F3]
labor = "ALPHA"
financing = "F3"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Full-employment mobile labour (eta=1), externally financed programme"

[cells.matrix_5x3-BETA-F1]
labor = "BETA"
financing = "F1"
eta = 1.0
eta_s = 0.5
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Elastic labour supply (eta_s=0.5), fully mobile allocation, compositional F1 shift"

[cells.matrix_5x3-BETA-F2]
labor = "BETA"
financing = "F2"
eta = 1.0
eta_s = 0.5
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Elastic labour supply (eta_s=0.5), fully mobile allocation, tax-financed programme"

[cells.matrix_5x3-BETA-F3]
labor = "BETA"
financing = "F3"
eta = 1.0
eta_s = 0.5
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Elastic labour supply (eta_s=0.5), fully mobile allocation, externally financed programme"

[cells.matrix_5x3-GAMMA-F1]
labor = "GAMMA"
financing = "F1"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Fixed real wage with fully mobile allocation (eta=1), compositional F1 shift"

[cells.matrix_5x3-GAMMA-F2]
labor = "GAMMA"
financing = "F2"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Fixed real wage with fully mobile allocation (eta=1), tax-financed programme"

[cells.matrix_5x3-GAMMA-F3]
labor = "GAMMA"
financing = "F3"
eta = 1.0
eta_s = 0.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
note = "Fixed real wage with fully mobile allocation (eta=1), externally financed programme"

[cells.matrix_5x3-DELTA-F1]
labor = "DELTA"
financing = "F1"
eta = 1.0
eta_s = 0.0
theta = 1e-4
epsilon = 1e-4
sigma = 1e-4
delta_epsilon = 1e-4
note = "DELTA corner (Leontief limit at eps=1e-4, eta=1). F1 has no additive anchor and the fixed-wage eta=1 system is scale-indeterminate, so this cell is expected to fail the guard (kept visible)."

[cells.matrix_5x3-DELTA-F2]
labor = "DELTA"
financing = "F2"
eta = 1.0
eta_s = 0.0
theta = 1e-4
epsilon = 1e-4
sigma = 1e-4
delta_epsilon = 1e-4
note = "DELTA corner (Leontief limit at eps=1e-4, eta=1), tax-financed programme"

[cells.matrix_5x3-DELTA-F3]
labor = "DELTA"
financing = "F3"
eta = 1.0
eta_s = 0.0
theta = 1e-4
epsilon = 1e-4
sigma = 1e-4
delta_epsilon = 1e-4
note = "DELTA corner (Leontief limit at eps=1e-4, eta=1), externally financed programme"
