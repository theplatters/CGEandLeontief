notes = "A demand-composition shifter, not a financing closure in the CGE taxonomy (cbase2/review.md §1). Must never be described as an autonomous investment multiplier (ROADMAP.md section 4.3; docs/DOCS_ASSESSMENT.md, verdict warning). The explicit tilt is implemented in the canonical pipeline: experiments/run.jl f1_tilt_weights computes d = 1 .+ G0 .* ψ1 ./ c0 (ψ restricted to positive-baseline sectors and renormalised, G0 = sum(g), c0 = data.household_baseline), replacing the retired non-reference 1 .+ ψ tilt (ψ added directly instead of G0 .* ψ1 ./ c0) (f1_shift tilt_g0_over_c0)."

[financing.F2]
id = "F2"
name = "Tax-financed public investment"
formulation = "sum_i p_i g_i = T(p); lump-sum / balanced-budget tax"
interpretation = "Autonomous public investment financed by an explicit tax counterparty (balanced government budget)."
status = "tested"
symbols = ["TaxFinanced"]
files = ["src/closures/financing/financing.jl"]
references = ["docs/closures/financing.md", "docs/DOCS_ASSESSMENT.md", "cbase2/documentation.md"]
tests = ["tests/test_promoted_closures.jl"]
evidence = ["cbase2/process_comments.md", "experiments/probes/numeraire_invariance.jl", "experiments/probes/analytic_headlines.jl"]
dead_ends = []
adrs = ["ADR-0002", "ADR-0005", "ADR-0010", "ADR-0018"]
open_gates = [
    "F2 cells executed for all five labour rows. RESOLVED by ADR-0018 and the matrix_5x3_v4 generation (runs/matrix_5x3-v4-*-F2/manifest.toml, 2026-09-18): the mobile full-employment rows read gdp_rel = 0.0 (income-side real GDP, flat -- the pre-registered 'aggregate ~ 0' signature holds) while consumption_rel = -1.69e-2 is the household-welfare contraction from the tax; the v3 real_gdp_rel = -1.69e-2 column was the welfare index, not GDP",
    "budget helper pricing inconsistency noted in review §2.7",
    "v3 saving/import accounting: implemented household demand is (1-s)E with import margins; the ADR-0002 identities hold exactly at s = 0, m = 0 (docs/closures/financing.md)",
    "CLOSED FORM / NEUTRALITY (2026-09-18, experiments/probes/numeraire_invariance.jl and analytic_headlines.jl, ADR-0019): the pre-ADR-0019 mobile F2 closed form consumption = 1 - k*G0/(1-tau0) is retired -- F enters E, so mobile F2 and F3 consumption_rel coincide at -1.82262e-2 (k = 1) and scale linearly with k (the welfare index is 1 - 1.82262e-2*k), while income-side gdp_rel stays 0; at the BF row the closed form holds exactly (0.983064081649 to 3.3e-16). Demand-only scaling to k = 10 leaves w = 1.0 and max|dp| <= 4.1e-15, so the gauge cannot move the real wage (DE-0011)",
