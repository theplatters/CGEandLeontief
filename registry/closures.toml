notes = "public_budget prices at sum(gov_demand) while taxes are dot(p, gov_demand) (cbase2/review.md §2.7), so government budget reports fail as soon as p != 1. The tax is implemented as an endogenous rate tau = dot(p, gG + g) / (w * sum L) on wage income; with one representative household the burden T(p) is effectively lump-sum."

[financing.F3]
id = "F3"
name = "External / debt-financed programme"
formulation = "sum_i p_i g_i = F; external balance F"
interpretation = "Net new expenditure with an external counterpart; resources arrive via the external balance (imports serve the investment). It is an accounting open-economy closure, not a monetary mechanism."
status = "tested"
symbols = ["ExternalDebt"]
files = ["src/closures/financing/financing.jl"]
references = ["docs/closures/financing.md", "docs/DOCS_ASSESSMENT.md", "cbase2/documentation.md"]
tests = ["tests/test_promoted_closures.jl", "tests/test_external_closure.jl"]
evidence = ["cbase2/process_comments.md", "runs/matrix_5x3-v6-ALPHA-F3/manifest.toml", "runs/matrix_5x3-v6-BETA-F3/manifest.toml", "runs/matrix_5x3-v6-BF-F3/manifest.toml", "runs/matrix_5x3-v6-GAMMA-F3/manifest.toml", "runs/matrix_5x3-v6-DELTA-F3/manifest.toml", "runs/matrix_5x3-v5-BF-F3/manifest.toml"]
dead_ends = []
adrs = ["ADR-0002", "ADR-0005", "ADR-0010", "ADR-0019", "ADR-0020"]
open_gates = [
    "F3 cells executed for all five labour rows (runs/matrix_5x3-*-F3/manifest.toml, 2026-09-17); the recorded external position is canary_diff = -8.5e-3 for the mobile eta = 1 rows and ~1e-16 for the fixed-wage rows, while the programme value F = dot(p, g) = 1.33e-2 -- the pre-registered 'external deficit = F' signature needs an agreed definition. RESOLVED by ADR-0019 and the matrix_5x3_v5 generation (15/15 executed 2026-09-18, commit f0af583): the programme financing is booked as B_gov = Σ p·g, the net external position is F + B_gov, and F2/F3 are real-neutral in the mobile regime (identical p, y, w; F_F3 = F_F2 - B_gov)",
    "at eta = 0 the programme booking is valued at the sectoral-wage prices (ADR-0020 option C), so B_gov reads +0.01484628 at BF-F3 against +0.01330991 in the v5 pin generation and in the GAMMA/DELTA rows (where the prices stay at the baseline); the net position F + B_gov = -0.008528 is financing-neutral at eta = 0 (runs/matrix_5x3-v6-BF-F3/manifest.toml)",
    "external_balance returns only the programme's import content (review §2.8) -- RESOLVED as a definition question by ADR-0019 (the diagnostic keeps returning the programme's import content; the external position is the booked F + B_gov)",
    "v3 saving/import accounting: implemented household demand is (1-s)E with import margins; the ADR-0002 identities hold exactly at s = 0, m = 0 (docs/closures/financing.md)",
    "at the BF eta = 0 row the booked entry is the programme booking, not a position: B_gov = +1.331 percent of GDP, identical in BF-F3, GAMMA-F3 and DELTA-F3; GAMMA/DELTA-F3 close their account to ~1e-12 (employment rises to 1.017796, the resources arrive from abroad) while BF-F3 is open by -0.7936 percent of GDP (resource side +0.5374 percent) -- see the labor.BF gates and ADR-0020. ADR-0020 accepted option C closes the eta = 0 account in the next generation (BF-F3 booked -0.00852841 with B_gov +0.01484628 at the eta = 0 prices, financing neutrality restored at eta = 0; probe7)",
]
notes = "Not a full current-account closure (cbase2/review.md §1). external_balance returns only the programme's import content (cbase2/review.md §2.8), and the recorded F = 0.00147 figure is ambiguous: about half of dot(p, m .* g) at baseline. ADR-0010 adds the asserted external-account canary: at mobile eta = 1 solutions the omitted N-th market residual equals S - (I+X-M) via external_balance_canary, asserted by tests and experiments. ADR-0019 supersedes the omitted-market reading: all N clearings are enforced, the programme financing is booked as B_gov = Σ p·g (B_gov = 0 otherwise), the net position is F + B_gov, and F2/F3 are real-neutral in the mobile regime (v5: B_gov = +1.331% of GDP, F_F3 = -1.432%, F_F2 = -0.101%, identical external position to ~2.6e-17). tests/test_external_closure.jl asserts the neutrality contract. At the BF eta = 0 row the booked B_gov is not a position: the pin fixes F = 0 and the account is open by the pin's labour residual (audit in experiments/probes/probe5*_bf_f3*.jl, 2026-09-18; ADR-0020 proposed)."
