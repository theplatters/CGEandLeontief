# experiments/designs/pricing_markup_v2.toml — ROADMAP Phase 7, Route 2 Stage A
# re-minted on OpenCGE v0.2.1 across all five labour rows (ADR-0032).
#
# The retained markup door (ADR-0029, closure P2): p_i = mu_i c_i with
# mu_i = 1 + kappa (y_i/lambda_i - 1), the rent booked as a leak beside saving
# (s_pi = 1). pricing_markup_v1 (GAMMA) and the markup cells of
# pricing_mobile_v1 (ALPHA) ran on v0.2.0; this design re-mints both on the
# current pin and adds BF (eta = 0), sectoral BETA (uniform eta_s = 0.5) and
# DELTA (Leontief corner), so the markup table spans all five rows in one
# generation. v0.2.1 leaves P2 untouched: the GAMMA and ALPHA cells must
# reproduce their v1 manifests. kappa = 0 nests the matrix_5x3_v10 twins.
#
schema_version = 1
design = "pricing_markup_v2"
description = "Phase 7 Route 2 Stage A re-minted on OpenCGE v0.2.1 (ADR-0029, ADR-0032): retained markup p = mu c, mu = 1 + kappa (y/lambda - 1), s_pi = 1, on all five labour rows (BF, ALPHA, sectoral BETA, GAMMA, DELTA) and all three financing columns, kappa in {0, 0.25, 0.5}. kappa = 0 nests the matrix_5x3-v10 twins; GAMMA/ALPHA reproduce the v1 markup cells."
smoke = false
[data]
vintage = "full-71-abill"
drops = []
calibration_root = "src"
source_table = "data/I-O_DE2019_formatiert.csv"
calibration_artifacts = []

[calibration]
saving_rate = 0.1199
intermediate_imports = 0.2214
intermediate_taxes = 0.0257449423974625
baseline_root_tol = 1e-12

[programme]
source = "cbase2/data_raw/impulses.csv"
year = 2024
column_slice = [3, 73]
total_eur_m = 40300.0
f1_shift = "tilt_g0_over_c0"

[reference]
labor = "ALPHA"
eta = 1.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
exo_scale_steps = 6
thetas = [2.0, 1.5, 1.2, 1.0, 0.8, 0.65, 0.5]

[gates]
residual_tol = 1e-6
budget_tol = 1e-9
labour_tol = 1e-6
wage_tol = 1e-8

[pricing]
kind = "markup"
kappa = 0.0
s_pi = 1.0
multistart_tol = 1e-6
continuation_steps = 4

