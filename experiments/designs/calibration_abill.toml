# experiments/designs/calibration_abill.toml — the A-bill calibration baseline
#
# Pre-registered record of the re-anchored calibration (ADR-0012): the
# intermediate demand is charged with the DOMESTIC bill (raw-table row 73) and
# the imported intermediates (row 74) enter the external account explicitly.
# This is a calibration-baseline design, not a cell experiment: it pins the
# numbers downstream work must re-anchor to. The baseline root is the observed
# data itself: (p, y, w) = (1, lambda, 1) with max|resid| = 3.5e-18.

schema_version = 1
design = "calibration_abill"
description = "A-bill calibration baseline (full-71): domestic intermediate bill, clamp eliminated, intermediate imports explicit in the external account"
smoke = false

[data]
vintage = "full-71-abill"
drops = []
calibration_root = "src"
source_table = "cbase2/data_raw/I-O_DE2019_formatiert.csv"

[calibration]
saving_rate_full = 0.1199
saving_rate_70s = 0.1285
intermediate_imports_full = 0.2214
intermediate_imports_70s = 0.2237
tau0 = 0.2141
export_share = 0.4219
investment_share = 0.1624

[gates]
baseline_root_tol = 1e-12        # max|resid| at (1, lambda, 1); measured 3.5e-18
identity_note = "external-identity canary: RESOLVED by ADR-0013. The -2.6e-2 gap was not a table discrepancy but the unbooked product taxes on intermediate use (row 75, T_int = 0.0257449424 of GDP); booked as the third leak of the purchaser-price intermediate bill the identity holds at 1.7e-16 (full-71) / 9.6e-17 (70s). The raw table's own P-E residual (5.387%) stays a separate open item."
variant_note = "70s: one microscopic identity residual (-2.4e-6) that is the retained-economy value of the same row-75 term, now visible on both sides of the canary (ADR-0013); reduced: fails the gap (7.7e-3) and is deferred with the dataset-variant decision"
