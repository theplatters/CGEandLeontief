delta_services = 0.0
note = "P1 VA-scaled capacity door, delta = +0.5 on goods (CPA A-F), 0 on services (CPA G-T), capacity pressure; fixed real wage, compositional F1 shift"

[cells.pricing_capacity-v2-GAMMA-F1-dm05]
