# experiments/designs/supply_etas_prog.toml — the supply arm, shock prog (ADR-0023)
#
# productivity gain A_i = 1 + alpha*psi_i on the programme's own sectors, alpha in {0.05,0.10,0.20}; identification-vehicle split per ADR-0023 (same as supply_etas_s1).

schema_version = 1
design = "supply_etas_prog"
description = "Supply arm prog: productivity gain A_i = 1 + alpha*psi_i on the programme's own sectors, alpha in {0.05,0.10,0.20}; full-71 A-bill; ALPHA control + scalar BETA (eta_s 0.5/1/2/5) + sectoral uniform BETA (eta_s 0.5/2), x F1/F2/F3 x 3 magnitudes. ADR-0023 [shock] schema."
smoke = false

[data]
vintage = "full-71-abill"
drops = []
calibration_root = "src"
source_table = "data/I-O_DE2019_formatiert.csv"
calibration_artifacts = []

[calibration]
saving_rate = 0.1199
intermediate_imports = 0.2214
intermediate_taxes = 0.0257449423974625
baseline_root_tol = 1e-12

[programme]
source = "cbase2/data_raw/impulses.csv"
year = 2024
column_slice = [3, 73]
total_eur_m = 40300.0
f1_shift = "tilt_g0_over_c0"

[reference]
labor = "ALPHA"
eta = 1.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
exo_scale_steps = 6
thetas = [2.0, 1.5, 1.2, 1.0, 0.8, 0.65, 0.5]

[gates]
residual_tol = 1e-6
budget_tol = 1e-9
labour_tol = 1e-6
wage_tol = 1e-8

[shock]
kind = "prog"
alpha = 0.10
note = "per-cell shock_alpha overrides the ladder"

