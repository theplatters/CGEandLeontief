# experiments/designs/supply_etas_s1.toml — the supply arm, shock s1 (ADR-0023)
#
# Sector-1 (agriculture) productivity shock added to the 40.3 bn programme,
# financing F1/F2/F3 as in the matrix. Identification vehicle split per
# ADR-0023: ALPHA control + scalar single-wage BETA (2N+2, the scalar
# ln L / ln w signature) + sectoral uniform BETA (3N+1, per-sector
# recovery) as the robustness row. Magnitude ladder A1 in {1.1,1.2,1.3}.
# The reference continuation stays no-shock and no-programme (ADR-0023).

schema_version = 1
design = "supply_etas_s1"
description = "Supply arm s1: +{1.1,1.2,1.3} productivity in sector 1 on the full-71 A-bill calibration, programme financed F1/F2/F3, ALPHA control + scalar BETA (eta_s 0.5/1/2/5) identification + sectoral uniform BETA (eta_s 0.5/2) robustness. ADR-0023 schema: [shock] kind=sectoral, targets=[1]."
smoke = false

[data]
vintage = "full-71-abill"
drops = []
calibration_root = "src"
source_table = "data/I-O_DE2019_formatiert.csv"
calibration_artifacts = []

[calibration]
saving_rate = 0.1199
intermediate_imports = 0.2214
intermediate_taxes = 0.0257449423974625
baseline_root_tol = 1e-12

[programme]
source = "cbase2/data_raw/impulses.csv"
year = 2024
column_slice = [3, 73]
total_eur_m = 40300.0
f1_shift = "tilt_g0_over_c0"

[reference]
labor = "ALPHA"
eta = 1.0
theta = 0.5
epsilon = 0.5
sigma = 0.9
exo_scale_steps = 6
thetas = [2.0, 1.5, 1.2, 1.0, 0.8, 0.65, 0.5]

[gates]
residual_tol = 1e-6
budget_tol = 1e-9
labour_tol = 1e-6
wage_tol = 1e-8

# ── the supply shock (ADR-0023 schema) ────────────────────────────────

[shock]
kind = "sectoral"
magnitude = 1.2
targets = [1]
note = "sector 1 (agriculture) productivity; per-cell shock_magnitude overrides the ladder"

# ── cells: ALPHA control + scalar BETA + sectoral BETA, x F1/F2/F3 x 3 magnitudes ──
